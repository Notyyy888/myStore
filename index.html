<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>หน้าขายยา · Workshop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#121212;--card:#181818;--white:#fff;--muted:#b3b3b3;--green:#1ed760;--orange:#ffa42b;--red:#f3727f;--line:#333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:16px/1.65 'Noto Sans Thai',sans-serif;padding:16px}main{max-width:1150px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}h1{margin:0;font-size:clamp(24px,4vw,34px)}a{color:var(--green)}.pill{display:inline-flex;padding:5px 12px;border-radius:99px;font-weight:700;font-size:14px}.source{background:#1d3c29;color:var(--green)}.fallback{background:#49341c;color:var(--orange)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.notice{border:1px solid var(--orange);color:var(--orange);padding:12px;border-radius:12px;margin-bottom:14px}.error{border:1px solid var(--red);color:var(--red);background:#301c20;padding:12px;border-radius:12px;margin:12px 0}.success{border:1px solid var(--green);color:var(--green);background:#183021;padding:12px;border-radius:12px;margin:12px 0}.muted{color:var(--muted)}label{display:block;font-weight:600;margin-bottom:6px}input,select{width:100%;min-height:54px;padding:12px;border-radius:12px;border:1px solid #454545;background:#222;color:#fff;font:inherit}button{font:inherit;font-weight:700;min-height:60px;border-radius:99px;padding:12px 22px;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--green);color:#07130b;width:100%;min-height:68px;font-size:19px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.medicine-list{display:grid;gap:10px;margin-top:14px}.medicine{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#202020}.medicine.selected{border-color:var(--green)}.medicine button{min-height:48px;background:#2b2b2b;color:#fff;padding:8px 16px}.medicine-title{font-weight:700}.stockline{color:var(--muted);font-size:14px}.low{color:var(--orange);background:#48331b;padding:3px 9px;border-radius:20px;font-size:13px;white-space:nowrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:550px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}#selectedDrug{color:var(--green);font-weight:700}.result{white-space:pre-wrap}.small{font-size:14px}@media(max-width:650px){body{padding:12px}.field-grid{grid-template-columns:1fr}.card{padding:14px}.medicine{align-items:flex-start;flex-direction:column}.medicine button{width:100%}}
</style></head><body><main>
<header><div><h1>หน้าขายยา</h1><div class="muted">Workshop ร้านยาจำลอง</div></div><a href="index.html">← เมนูหลัก</a></header>
<div id="sourceBanner" class="pill source">กำลังโหลดข้อมูล…</div>
<div id="fallbackNotice" class="notice" hidden>ข้อมูลสำรอง — ระบบขายถูกปิดไว้จนกว่าจะเชื่อมต่อ API ได้</div>
<div id="message" aria-live="polite"></div>
<section class="card"><h2 style="margin-top:0">เลือกยา</h2><label for="search">ค้นหาชื่อยา / SKU</label><input id="search" type="search" placeholder="พิมพ์ชื่อยา หรือรหัสยา…" autocomplete="off"><div id="medicineList" class="medicine-list"></div></section>
<section class="card"><h2 style="margin-top:0">รายการจ่ายยา</h2><div class="muted">ยาที่เลือก: <span id="selectedDrug">ยังไม่ได้เลือกยา</span></div><div class="field-grid" style="margin-top:12px"><div><label for="qty">จำนวน (จำนวนเต็ม ≥ 1)</label><input id="qty" type="number" min="1" step="1" inputmode="numeric" placeholder="จำนวน"></div><div><label for="patient">รหัสผู้ป่วย (patient_code)</label><input id="patient" type="text" placeholder="รหัสผู้ป่วยจำลอง"></div><div style="grid-column:1/-1"><label for="pharmacist">รหัสเภสัชกร (pharmacist_code)</label><input id="pharmacist" type="text" placeholder="รหัสเภสัชกร"></div></div><button id="sell" class="primary" disabled style="margin-top:16px">บันทึกการจ่ายยา</button></section>
<section class="card"><h2 style="margin-top:0">รายการจ่ายล่าสุด 8 รายการ</h2><div class="table-wrap"><table><thead><tr><th>เวลา</th><th>ยา</th><th>จำนวน</th><th>รายการ</th></tr></thead><tbody id="recent"></tbody></table></div></section>
<p class="notice">ข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</p></main>
<script>
const $=id=>document.getElementById(id);let datasets=null,selected=null,isFallback=true,usableBySku={},drugBySku={},catalogBySku={},recentRows=[];
const banner=$('sourceBanner'),fallbackNotice=$('fallbackNotice'),sell=$('sell');
function setBanner(fallback){isFallback=fallback;banner.textContent=fallback?'ข้อมูลสำรอง':'ข้อมูลจากระบบ';banner.className='pill '+(fallback?'fallback':'source');fallbackNotice.hidden=!fallback;sell.disabled=fallback||!selected;}
function asArray(x){return Array.isArray(x)?x:[];}
function skuOf(d){return String(d.sku??d.code??d.drug_code??'').trim();}
function labelOf(d){return String(d.name_th??d.name??d.title??d.generic_name??skuOf(d));}
function activeCatalog(sku){const c=catalogBySku[sku];return !c||c.is_active!==false;}
function computeUsable(stockItems,asOf,allowMissingStatus){usableBySku={};for(const lot of asArray(stockItems)){const sku=String(lot.sku??'');const status=lot.status;if(!(allowMissingStatus&&status==null)&&status!=='active')continue;const expiry=lot.expiry;if(!expiry||String(expiry).slice(0,10)<String(asOf).slice(0,10))continue;const q=Number(lot.qty_on_hand);if(!Number.isFinite(q)||q<=0)continue;usableBySku[sku]=(usableBySku[sku]||0)+q;}}
function validateShape(data){return !!(data&&data.drugs&&Array.isArray(data.drugs.items)&&data.stock&&data.stock.meta&&typeof data.stock.meta.as_of==='string'&&Array.isArray(data.stock.items)&&data.dispense_log&&Array.isArray(data.dispense_log.items));}
async function fetchJson(url,signal){const r=await fetch(url,{signal,cache:'no-store'});if(!r.ok)throw new Error('โหลด '+url+' ไม่สำเร็จ ('+r.status+')');return r.json();}
async function loadData(){try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),8000);let data;try{const response=await fetch('/api/data',{signal:controller.signal,cache:'no-store'});if(!response.ok)throw new Error('API HTTP '+response.status);data=await response.json();}finally{clearTimeout(timeout);}if(!validateShape(data))throw new Error('ข้อมูล API ไม่ครบ');datasets=data;setBanner(false);applyData();return;}catch(e){console.warn('API unavailable, using fallback files',e);}
try{const [drugs,stock,log]=await Promise.all([fetchJson('./drugs.json'),fetchJson('./stock.json'),fetchJson('./dispense-log.json')]);if(!Array.isArray(drugs)||!stock||!Array.isArray(stock.items)||!Array.isArray(log))throw new Error('ไฟล์สำรองมีโครงสร้างไม่ครบ');datasets={drugs:{items:drugs},stock:{meta:stock.meta||{as_of:new Date().toISOString().slice(0,10)},items:stock.items},dispense_log:{items:log},catalog:null};setBanner(true);applyData();}catch(err){setBanner(true);$('medicineList').textContent='โหลดข้อมูลยาไม่สำเร็จ กรุณาตรวจไฟล์ JSON สำรอง';sell.disabled=true;$('message').textContent='ไม่สามารถโหลดข้อมูล: '+err.message;}}
function applyData(){const drugs=asArray(datasets.drugs.items);const catItems=asArray(datasets.catalog?.items);catalogBySku={};catItems.forEach(c=>catalogBySku[String(c.sku??'')]=c);drugBySku={};drugs.forEach(d=>{const sku=skuOf(d);if(sku)drugBySku[sku]=d;});computeUsable(asArray(datasets.stock.items),datasets.stock.meta.as_of,isFallback);recentRows=asArray(datasets.dispense_log.items);renderMedicine();renderRecent();}
function reorderLevel(d){const c=catalogBySku[skuOf(d)]||{};const n=Number(d.reorder_level??d.reorder_point??d.min_stock??c.reorder_level??c.reorder_point??c.min_stock??0);return Number.isFinite(n)?n:0;}
function renderMedicine(){const list=$('medicineList');list.replaceChildren();const query=$('search').value.trim().toLocaleLowerCase();const items=asArray(datasets?.drugs?.items).filter(d=>{const sku=skuOf(d);if(!sku||!activeCatalog(sku)||!(usableBySku[sku]>0))return false;const search=(sku+' '+labelOf(d)+' '+String(d.brand??'')).toLowerCase();return search.includes(query);});if(!items.length){const p=document.createElement('p');p.className='muted';p.textContent='ไม่พบยาที่มียอดใช้ได้';list.append(p);return;}items.forEach(d=>{const sku=skuOf(d),qty=usableBySku[sku]||0,rl=reorderLevel(d);const div=document.createElement('div');div.className='medicine'+(selected===sku?' selected':'');const info=document.createElement('div');const name=document.createElement('div');name.className='medicine-title';name.textContent=labelOf(d)+' · '+sku;const stock=document.createElement('div');stock.className='stockline';stock.textContent='ยอดใช้ได้ '+qty;info.append(name,stock);if(rl>0&&qty<rl){const badge=document.createElement('span');badge.className='low';badge.textContent='ต่ำกว่าจุดสั่งซื้อ';info.append(badge);}const btn=document.createElement('button');btn.type='button';btn.textContent=selected===sku?'เลือกแล้ว':'เลือกยา';btn.addEventListener('click',()=>{selected=sku;$('selectedDrug').textContent=labelOf(d)+' ('+sku+')';sell.disabled=isFallback;renderMedicine();});div.append(info,btn);list.append(div);});}
function renderRecent(){const tbody=$('recent');tbody.replaceChildren();const rows=recentRows.slice().filter(r=>String(r.type??'dispense')==='dispense').slice(-8).reverse();if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.className='muted';td.textContent='ยังไม่มีรายการจ่ายยา';tr.append(td);tbody.append(tr);return;}rows.forEach(r=>{const tr=document.createElement('tr');const time=document.createElement('td');time.textContent=String(r.datetime??r.created_at??r.timestamp??'-');const sku=String(r.sku??r.drug_sku??'');const drug=document.createElement('td');drug.textContent=(labelOf(drugBySku[sku]||{})+' '+sku).trim();const qty=document.createElement('td');qty.textContent=String(r.qty??r.quantity??'-');const type=document.createElement('td');type.textContent='จ่ายยา';tr.append(time,drug,qty,type);tbody.append(tr);});}
function showError(text){const box=document.createElement('div');box.className='error result';box.textContent=text;$('message').replaceChildren(box);}
function showSuccess(result){const box=document.createElement('div');box.className='success result';const title=document.createElement('strong');title.textContent='จ่ายแล้ว';box.append(title);const details=document.createElement('div');details.textContent='ล็อตที่ตัด: '+asArray(result.lines).map(l=>String(l.lot??'-')+' × '+String(l.qty??0)).join(', ');box.append(details);const totals=document.createElement('div');totals.textContent='ยอดใช้ได้ก่อน '+String(result.usable_before??'-')+' → หลัง '+String(result.usable_after??'-');box.append(totals);$('message').replaceChildren(box);}
sell.addEventListener('click',async()=>{if(sell.disabled)return;const qty=Number($('qty').value),patient=$('patient').value.trim(),pharmacist=$('pharmacist').value.trim();if(!Number.isInteger(qty)||qty<1){showError('กรุณากรอกจำนวนเป็นจำนวนเต็มตั้งแต่ 1 ขึ้นไป');return;}if(!patient||!pharmacist){showError('กรุณากรอกรหัสผู้ป่วยและรหัสเภสัชกร');return;}if(!selected){showError('กรุณาเลือกยา');return;}sell.disabled=true;sell.textContent='กำลังบันทึก…';$('message').replaceChildren();try{const response=await fetch('/api/dispense',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sku:selected,qty,patient_code:patient,pharmacist_code:pharmacist})});const result=await response.json();if(!response.ok||result.ok!==true){showError(String(result.message??'บันทึกการจ่ายยาไม่สำเร็จ'));return;}showSuccess(result);$('patient').value='';const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),8000);try{const res=await fetch('/api/data',{signal:controller.signal,cache:'no-store'});if(!res.ok)throw new Error('refresh HTTP '+res.status);const fresh=await res.json();if(!validateShape(fresh))throw new Error('ข้อมูล refresh ไม่ครบ');datasets=fresh;setBanner(false);applyData();}catch(refreshErr){console.warn('Refresh after dispense failed',refreshErr);const refreshNote=document.createElement('div');refreshNote.className='notice';refreshNote.textContent='บันทึกจ่ายยาสำเร็จแล้ว แต่โหลดยอดล่าสุดไม่สำเร็จ กรุณารีเฟรชข้อมูลภายหลัง';$('message').append(refreshNote);}finally{clearTimeout(timeout);}}catch(err){showError('เชื่อมต่อระบบจ่ายยาไม่สำเร็จ: '+err.message);}finally{sell.textContent='บันทึกการจ่ายยา';sell.disabled=isFallback||!selected;}});
$('search').addEventListener('input',renderMedicine);loadData();
</script></body></html>
